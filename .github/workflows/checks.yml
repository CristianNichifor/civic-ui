name: Package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/react18/package-lock.json
            fixtures/react19/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # Only browser checks run in the image; normal tooling stays on the Node version above.
      - name: Chromium, Firefox and WebKit checks
        run: docker run --rm --ipc=host -e CI=1 -v "$GITHUB_WORKSPACE:/work" -w /work mcr.microsoft.com/playwright:v1.63.0-noble npm test
      - run: npm run test:release
      - run: npm run release:assets
